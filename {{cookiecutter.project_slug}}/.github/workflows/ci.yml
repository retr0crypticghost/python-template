name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${% raw %}{{ matrix.python-version }}{% endraw %} on ${% raw %}{{ matrix.os }}{% endraw %}
    runs-on: ${% raw %}{{ matrix.os }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Set up Python ${% raw %}{{ matrix.python-version }}{% endraw %}
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.1.0
        with:
          python-version: ${% raw %}{{ matrix.python-version }}{% endraw %}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          {%- if cookiecutter.package_manager == "uv" %}
          pip install uv
          uv pip install -e ".[dev]"
          {%- elif cookiecutter.package_manager == "hatch" %}
          pip install hatch
          hatch env create
          {%- else %}
          pip install -e ".[dev]"
          {%- endif %}

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

      - name: Lint with Ruff
        run: |
          {%- if cookiecutter.package_manager == "hatch" %}
          hatch run ruff check .
          hatch run ruff format --check .
          {%- else %}
          ruff check .
          ruff format --check .
          {%- endif %}

      - name: Type check with mypy
        run: |
          {%- if cookiecutter.package_manager == "hatch" %}
          hatch run mypy src/
          {%- else %}
          mypy src/
          {%- endif %}

      - name: Security audit with pip-audit
        run: |
          {%- if cookiecutter.package_manager == "uv" %}
          pip install pip-audit
          uv pip list --format=json | pip-audit --desc --format=json --input-format=json
          {%- elif cookiecutter.package_manager == "hatch" %}
          pip install pip-audit
          hatch run pip list --format=json | pip-audit --desc --format=json --input-format=json
          {%- else %}
          pip install pip-audit
          pip-audit --desc --format=json
          {%- endif %}

      - name: Test with pytest
        run: |
          {%- if cookiecutter.package_manager == "hatch" %}
          hatch run pytest -q --cov --cov-report=xml -W error
          {%- else %}
          pytest -q --cov --cov-report=xml -W error
          {%- endif %}

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '{{ cookiecutter.python_version }}'
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673  # v4.5.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673  # v4.5.0
        if: {% raw %}matrix.python-version == '3.12'{% endraw %}
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a  # v4.3.6
        if: {% raw %}matrix.python-version == '3.12'{% endraw %}
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30
